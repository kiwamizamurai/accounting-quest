<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="レモネード屋を経営しながら複式簿記を学ぶ、ビジュアルノベル形式の会計学習ゲーム。全3レベル・32章。">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png">
  <link rel="canonical" href="https://kiwamizamurai.github.io/accounting-quest/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Accounting Quest">
  <meta property="og:title" content="The Accounting Quest - 会計の冒険">
  <meta property="og:description" content="レモネード屋を経営しながら複式簿記を学ぶ、ビジュアルノベル形式の会計学習ゲーム。全3レベル・32章。">
  <meta property="og:url" content="https://kiwamizamurai.github.io/accounting-quest/">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:image" content="https://kiwamizamurai.github.io/accounting-quest/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ピクセルアートのレモンの断面をT勘定で割ったアイコンと、ゲームタイトル The Accounting Quest">
  <meta name="twitter:card" content="summary_large_image">
  <title>The Accounting Quest - 会計の冒険</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
    }
    canvas {
      /* The canvas is rendered at a higher resolution than it is shown, so let the browser smooth it */
      image-rendering: auto;
      outline: none;
    }
    canvas:focus {
      outline: none;
    }
    /* Loading screen */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffd700;
      font-size: 24px;
      text-align: center;
    }
    #loading.hidden {
      display: none;
    }
    .loading-dots::after {
      content: '.';
      animation: dots 1.5s steps(4, end) infinite;
    }
    /* The game is laid out for a portrait screen. On a phone held sideways it is a small column in the middle. */
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(26, 26, 46, 0.96);
      color: #ffd700;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      font-size: 20px;
      line-height: 1.6;
    }
    #rotate-hint small {
      display: block;
      color: #cfd2e6;
      font-size: 15px;
    }
    #rotate-hint button {
      margin-top: 8px;
      padding: 10px 20px;
      font: inherit;
      font-size: 15px;
      color: #ffffff;
      background: #4a4a6a;
      border: 2px solid #5a5a7a;
      border-radius: 6px;
    }
    @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
      #rotate-hint:not(.dismissed) { display: flex; }
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>The Accounting Quest</div>
    <div>Loading<span class="loading-dots"></span></div>
  </div>
  <div id="game-container"></div>
  <div id="rotate-hint">
    <div>縦向きで遊ぶと見やすくなります<small>The game is designed for portrait. Rotate your device for the best view.</small></div>
    <button type="button" id="rotate-hint-dismiss">このまま遊ぶ / Play anyway</button>
  </div>
  <script>
    document.getElementById('rotate-hint-dismiss').addEventListener('click', function () {
      document.getElementById('rotate-hint').classList.add('dismissed');
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
