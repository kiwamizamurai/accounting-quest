<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="The Accounting Quest - Learn accounting through an epic pixel art RPG adventure">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Accounting Quest">
  <meta property="og:description" content="Learn double-entry bookkeeping by running a lemonade stand. A visual novel-style educational game.">
  <meta property="og:url" content="https://kiwamizamurai.github.io/accounting-quest/">
  <meta property="og:image" content="https://kiwamizamurai.github.io/accounting-quest/icon-512.png">
  <meta name="twitter:card" content="summary">
  <title>The Accounting Quest - 会計の冒険</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
    }
    #game-container {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
    }
    canvas:focus {
      outline: none;
    }
    /* Loading screen */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffd700;
      font-size: 24px;
      text-align: center;
    }
    #loading.hidden {
      display: none;
    }
    .loading-dots::after {
      content: '.';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>The Accounting Quest</div>
    <div>Loading<span class="loading-dots"></span></div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
